name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache git zlib1g-dev libssl-dev libffi-dev libgdbm-dev libncursesw5-dev libsqlite3-dev tk-dev libltdl-dev libtool autoconf automake blt x11proto-core-dev libx11-dev libxt-dev libxft-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.33 kivy

      - name: Initialize Buildozer
        run: |
          buildozer init
          sed -i 's/# android.ndk =/android.ndk = 25c/' buildozer.spec
          sed -i 's/android.ndk =/android.ndk = 25c/' buildozer.spec

      - name: Build with Buildozer
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Messenger-APK
          path: bin/*.apk
